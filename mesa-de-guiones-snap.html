<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de Guiones · Intérprete SNAP / WIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1F35; --ink-2:#17304F; --ink-3:#26445F;
  --paper:#F4F1E9; --card:#FFFFFF;
  --signal:#E0A02F;      /* canal EN → REP */
  --canal-es:#1B7A72;    /* canal ES → LEP */
  --alert:#B8472F;
  --muted:#63788F;
  --line:rgba(14,31,53,.13);
  --display:'Montserrat','Century Gothic','Lato',sans-serif;
  --body:'Lato','Century Gothic','Montserrat',sans-serif;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ── Consola superior ───────────────────────────── */
.console{
  position:sticky;top:0;z-index:40;
  background:var(--ink); color:#EDF1F6;
  border-bottom:3px solid var(--signal);
}
.console-top{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 22px 12px;
  max-width:1240px;margin:0 auto;
}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.lamp{
  width:11px;height:11px;border-radius:50%;
  background:var(--signal);box-shadow:0 0 0 0 rgba(224,160,47,.6);
  flex:none;
}
body.live .lamp{animation:pulse 1.9s ease-out infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(224,160,47,.55)}
  70%{box-shadow:0 0 0 12px rgba(224,160,47,0)}
  100%{box-shadow:0 0 0 0 rgba(224,160,47,0)}
}
.brand h1{
  font-family:var(--display);font-weight:800;font-size:15px;
  letter-spacing:.14em;text-transform:uppercase;margin:0;
}
.brand span{display:block;font-family:var(--body);font-weight:400;font-size:11.5px;letter-spacing:.06em;color:#9DB2C9;text-transform:none}
.search{
  position:relative;flex:1 1 260px;max-width:380px;
}
.search input{
  width:100%;padding:9px 12px 9px 34px;
  background:var(--ink-2);border:1px solid #2E4E70;border-radius:var(--r);
  color:#EDF1F6;font-family:var(--body);font-size:14.5px;
}
.search input::placeholder{color:#7E93AC}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.65}
.tools{display:flex;gap:8px;align-items:center}
.tbtn{
  background:transparent;border:1px solid #35577B;color:#C9D7E6;
  border-radius:var(--r);padding:8px 13px;font-size:12.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;font-family:var(--display);
}
.tbtn:hover{background:var(--ink-2);color:#fff}
.tbtn.on{background:var(--signal);border-color:var(--signal);color:#1A1206}
.tbtn.count{background:var(--signal);border-color:var(--signal);color:#1A1206}
.tbtn.count[data-n="0"]{background:transparent;border-color:#35577B;color:#C9D7E6}

/* pestañas */
.tabs{
  display:flex;gap:0;max-width:1240px;margin:0 auto;padding:0 22px;
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:none;border:0;border-bottom:3px solid transparent;
  color:#93AAC4;padding:9px 0;margin-right:26px;white-space:nowrap;
  font-family:var(--display);font-weight:700;font-size:12.5px;
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:-3px;
}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--signal)}

/* ── Cuerpo ─────────────────────────────────────── */
.shell{max-width:1240px;margin:0 auto;padding:26px 22px 120px;display:grid;grid-template-columns:206px 1fr;gap:30px}
@media(max-width:860px){.shell{grid-template-columns:1fr;gap:18px}}

.rail{position:sticky;top:112px;align-self:start}
@media(max-width:860px){
  .rail{position:static;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
}
.rail-h{
  font-family:var(--display);font-size:10.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0 0 10px;
}
@media(max-width:860px){.rail-h{display:none}}
.cat{
  display:block;width:100%;text-align:left;background:none;border:0;
  border-left:2px solid var(--line);padding:7px 0 7px 12px;
  font-size:14px;color:var(--ink-3);white-space:nowrap;
}
.cat b{display:block;font-weight:700;font-size:14px}
.cat i{font-style:normal;font-size:11.5px;color:var(--muted)}
.cat:hover{border-left-color:var(--ink-3);color:var(--ink)}
.cat[aria-pressed="true"]{border-left:2px solid var(--signal);color:var(--ink);background:rgba(224,160,47,.09)}
@media(max-width:860px){
  .cat{width:auto;border:1px solid var(--line);border-radius:var(--r);padding:7px 12px}
  .cat i{display:none}
  .cat[aria-pressed="true"]{border-color:var(--signal)}
}

.meta{font-size:13px;color:var(--muted);margin:0 0 16px}

/* ── Tarjeta de guion (elemento firma) ──────────── */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:16px;overflow:hidden;
}
.card-head{padding:15px 18px 12px;border-bottom:1px dashed var(--line)}
.eyebrow{
  font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.eyebrow .sens{color:var(--alert)}
.card-head h3{
  font-family:var(--display);font-weight:700;font-size:17px;line-height:1.3;
  margin:7px 0 0;letter-spacing:-.01em;
}
.note{font-size:13.5px;color:var(--ink-3);margin:7px 0 0;font-style:italic}
body.live .note{display:none}

.lane{display:flex;gap:0;border-top:1px solid var(--line)}
.lane:first-of-type{border-top:0}
.lane-rail{width:6px;flex:none}
.lane.en .lane-rail{background:var(--signal)}
.lane.es .lane-rail{background:var(--canal-es)}
.lane-body{padding:13px 18px 15px;flex:1;min-width:0}
.chip{
  font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;display:inline-block;margin-bottom:7px;
}
.lane.en .chip{color:#9A6B12}
.lane.es .chip{color:var(--canal-es)}
.say{font-size:17px;line-height:1.62;margin:0;color:#0B1A2C}
body.live .say{font-size:19.5px;line-height:1.7}
.say em{font-style:italic;color:var(--ink-3)}

.card-foot{display:flex;gap:8px;padding:11px 18px 14px;background:#FBFAF7;border-top:1px solid var(--line)}
.abtn{
  background:none;border:1px solid var(--line);border-radius:var(--r);
  padding:6px 11px;font-size:12px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;font-family:var(--display);color:var(--ink-3);
}
.abtn:hover{border-color:var(--ink-3);color:var(--ink)}
.abtn.added{background:var(--ink);border-color:var(--ink);color:#fff}

.empty{
  border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;
  text-align:center;color:var(--muted);font-size:15px;
}

/* ── Glosario ───────────────────────────────────── */
table.gloss{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
table.gloss th{
  font-family:var(--display);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  text-align:left;padding:11px 14px;background:var(--ink);color:#DCE6F1;font-weight:700;
}
table.gloss td{padding:11px 14px;border-top:1px solid var(--line);font-size:15px;vertical-align:top}
table.gloss td:first-child{font-weight:700;width:27%}
table.gloss td:nth-child(2){color:var(--canal-es);font-weight:700;width:28%}
table.gloss td:last-child{font-size:13.5px;color:var(--ink-3)}
.trap{color:var(--alert);font-weight:700}
@media(max-width:660px){
  table.gloss,table.gloss tbody,table.gloss tr,table.gloss td{display:block;width:100%}
  table.gloss thead{display:none}
  table.gloss tr{border-top:1px solid var(--line);padding:6px 0}
  table.gloss td{border:0;padding:3px 14px}
  table.gloss td:first-child,table.gloss td:nth-child(2){width:auto}
}

/* ── Bandeja del guion ──────────────────────────── */
.tray{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--ink);color:#E8EEF5;border-top:3px solid var(--signal);
  transform:translateY(calc(100% - 46px));transition:transform .28s ease;
  max-height:74vh;display:flex;flex-direction:column;
}
.tray.open{transform:translateY(0)}
.tray-bar{
  display:flex;align-items:center;gap:14px;padding:0 22px;height:46px;flex:none;
  max-width:1240px;margin:0 auto;width:100%;
}
.tray-bar button.grab{
  background:none;border:0;color:#E8EEF5;font-family:var(--display);
  font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  margin-right:auto;display:flex;align-items:center;gap:10px;padding:0;height:46px;
}
.tray-scroll{overflow-y:auto;padding:6px 22px 24px;max-width:1240px;margin:0 auto;width:100%}
.tline{border-top:1px solid #2B4A6B;padding:13px 0;display:flex;gap:14px;align-items:flex-start}
.tline .n{font-family:var(--display);font-weight:800;font-size:12px;color:var(--signal);padding-top:3px;flex:none;width:22px}
.tline .txt{flex:1;min-width:0}
.tline h4{margin:0 0 6px;font-family:var(--display);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#9DB2C9;font-weight:700}
.tline p{margin:0 0 5px;font-size:15.5px;line-height:1.55}
.tline p.p-en{color:#FBE3B8}
.tline p.p-es{color:#A9DBD5}
.tline .rm{background:none;border:1px solid #35577B;color:#9DB2C9;border-radius:var(--r);font-size:11px;padding:3px 8px;font-family:var(--display);font-weight:700;flex:none}
.tline .rm:hover{border-color:var(--alert);color:#F0A292}
.tray-actions{display:flex;gap:8px;padding:14px 0 0;flex-wrap:wrap}

.toast{
  position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--ink-2);color:#fff;border:1px solid var(--signal);
  padding:9px 17px;border-radius:var(--r);font-size:13.5px;z-index:70;
  opacity:0;pointer-events:none;transition:all .22s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media print{
  .console,.rail,.card-foot,.tray-bar,.tray-actions,.toast,.meta{display:none!important}
  body{background:#fff}
  .tray{position:static;transform:none;max-height:none;background:#fff;color:#000;border:0}
  .tline p.p-en,.tline p.p-es{color:#000}
  .tline{border-top:1px solid #999}
  .shell{display:block}
}
</style>
</head>
<body>

<header class="console">
  <div class="console-top">
    <div class="brand">
      <span class="lamp" aria-hidden="true"></span>
      <div>
        <h1>Mesa de Guiones</h1>
        <span>Intérprete remoto · SNAP / Food Stamps / WIC · ES ⇄ EN</span>
      </div>
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9DB2C9" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Buscar situación, término o frase…  ( / )" aria-label="Buscar">
    </div>
    <div class="tools">
      <button class="tbtn" id="liveBtn" aria-pressed="false">Modo llamada</button>
      <button class="tbtn count" id="trayBtn" data-n="0">Guion · 0</button>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-view="disclosures">Aclaratorias</button>
    <button class="tab" role="tab" aria-selected="false" data-view="statement">Declaración grabada</button>
    <button class="tab" role="tab" aria-selected="false" data-view="gloss">Glosario y trampas</button>
  </nav>
</header>

<main class="shell">
  <aside class="rail" id="rail"></aside>
  <section id="stage"></section>
</main>

<div class="tray" id="tray">
  <div class="tray-bar">
    <button class="grab" id="grabBtn" aria-expanded="false">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E0A02F" stroke-width="3"><path d="M6 15l6-6 6 6"/></svg>
      Guion armado · <span id="trayN">0</span>
    </button>
    <button class="tbtn" id="copyAll">Copiar todo</button>
    <button class="tbtn" id="printAll">Imprimir</button>
    <button class="tbtn" id="clearAll">Vaciar</button>
  </div>
  <div class="tray-scroll" id="trayScroll"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─────────────────────────────────────────────────────────────
   BIBLIOTECA DE ACLARATORIAS
   en  = lo que el intérprete dice al REP (tercera persona)
   es  = lo que el intérprete dice al beneficiario (LEP)
   ───────────────────────────────────────────────────────────── */
const CATS = [
  {id:'protocolo', name:'Protocolo',      sub:'Apertura y cierre'},
  {id:'audio',     name:'Audio',          sub:'Repetición y ruido'},
  {id:'termino',   name:'Terminología',   sub:'Palabras y siglas'},
  {id:'flujo',     name:'Flujo',          sub:'Terceros y turnos'},
  {id:'snap',      name:'Contenido SNAP', sub:'Trámite y derechos'},
  {id:'wic',       name:'Contenido WIC',  sub:'Clínica y eWIC'},
  {id:'etica',     name:'Límites éticos', sub:'Lo que no se hace'}
];

const D = [
/* ── PROTOCOLO ─────────────────────────────────── */
{c:'protocolo', t:'Entras a la llamada',
 n:'Identifícate una sola vez y cede el turno. No preguntes de qué se trata la llamada.',
 en:'Thank you for holding. This is Spanish interpreter ID number [____]. How may I assist you today?'},

{c:'protocolo', t:'Antes de la primera intervención del beneficiario',
 n:'Aviso breve al REP de que vas a presentarte con el beneficiario; luego lo haces en español.',
 en:'The interpreter will now briefly introduce herself/himself to the Spanish-speaking party.',
 es:'Buenos días, le habla el intérprete de español, identificación [____]. Todo lo que se diga será interpretado y es confidencial. Por favor hable directamente con la representante.'},

{c:'protocolo', t:'El REP y el beneficiario se hablan en tercera persona',
 n:'Recordatorio de primera persona. Una sola vez por llamada, salvo reincidencia clara.',
 en:'The interpreter would like to remind both parties to please address each other directly, in the first person.'},

{c:'protocolo', t:'Termina la llamada',
 n:'No agregues despedidas propias ni deseos de buena suerte al beneficiario.',
 en:'This concludes the interpretation. Thank you for using our services.'},

{c:'protocolo', t:'Te piden esperar en línea o transferir',
 n:'Confirma que sigues en línea para que no te den por desconectado.',
 en:'Understood. The interpreter will remain on the line.',
 es:'Vamos a esperar en la línea, no cuelgue por favor.'},

/* ── AUDIO ─────────────────────────────────────── */
{c:'audio', t:'No escuchaste la última frase',
 n:'Pide repetición sin justificar de más. Especifica a qué parte le hablas.',
 en:'The interpreter would like the representative to please repeat the last statement.'},

{c:'audio', t:'No escuchaste al beneficiario',
 n:'Mismo pedido pero sobre el LEP; el REP debe saber que la pausa es tuya y no del sistema.',
 en:'The interpreter would like to ask the client to repeat; the interpreter did not hear the last statement.',
 es:'Disculpe, ¿podría repetir lo último que dijo? No lo escuché bien.'},

{c:'audio', t:'El REP habla demasiado largo sin pausar',
 n:'Pide segmentación antes de perder contenido, no después de un error.',
 en:'The interpreter would like to ask the representative to please pause after each sentence so the message can be rendered accurately and completely.'},

{c:'audio', t:'Ruido de fondo del lado del beneficiario',
 n:'Reporta la causa; la solución la decide el REP.',
 en:'The interpreter is having difficulty hearing the client due to background noise on the client\'s line. May the interpreter ask the client to move to a quieter area?',
 es:'Hay mucho ruido de fondo y no la escucho bien. ¿Podría moverse a un lugar más silencioso?'},

{c:'audio', t:'Necesitas deletreo de un nombre',
 n:'Siempre pide deletreo para nombres, apellidos compuestos y direcciones. No adivines.',
 en:'The interpreter would like to request the spelling of that name for the record.',
 es:'Por favor, deletree su apellido letra por letra.'},

{c:'audio', t:'Necesitas confirmar una cifra o una fecha',
 n:'Montos, SSN, números de caso y fechas se repiten dígito por dígito.',
 en:'The interpreter would like to verify the figure that was just stated.',
 es:'Voy a repetir el número para confirmarlo, dígito por dígito.'},

{c:'audio', t:'Ambas partes hablan al mismo tiempo',
 n:'Corta el traslape apenas ocurre; después ya perdiste las dos versiones.',
 en:'The interpreter would like to ask that only one party speak at a time so that everything can be rendered.'},

{c:'audio', t:'El beneficiario no responde',
 n:'Reporta el hecho tras dos intentos, sin especular sobre por qué.',
 en:'The interpreter has rendered the question twice and there is no response from the client.'},

{c:'audio', t:'Se cortó la línea del beneficiario',
 n:'Reporta la caída; no cuelgues por tu cuenta.',
 en:'The interpreter can no longer hear the client. The line appears to have disconnected.'},

/* ── TERMINOLOGÍA ──────────────────────────────── */
{c:'termino', t:'El beneficiario no entiende un término del programa',
 n:'Clave: interpretaste bien, no expliques tú. Devuelve la explicación al REP.',
 en:'The interpreter has rendered the term accurately. The client states that he/she does not understand the term. Could the representative please explain it?'},

{c:'termino', t:'El REP usa un término que no te queda claro',
 n:'Pedir aclaración es correcto; inventar un equivalente no lo es.',
 en:'The interpreter would like to request clarification of the term "____" before rendering it.'},

{c:'termino', t:'El REP usa una sigla',
 n:'Frecuentes en esta cola: EBT, IPV, ABAWD, SUA, LIHEAP, IEVS, SAVE, TANF, QC.',
 en:'The interpreter would like to request the meaning of the acronym "____" so it can be rendered accurately.'},

{c:'termino', t:'No existe equivalente directo en español',
 n:'Ej. spenddown, ABAWD, expedited processing. Se dice el término y se describe.',
 en:'The interpreter would like to inform the parties that there is no direct equivalent for that term in Spanish. The interpreter will state the term and render a brief description.'},

{c:'termino', t:'Variación regional del beneficiario',
 n:'Ej. «estampillas», «bonos», «cupones», «la tarjeta». Reporta, no corrijas al beneficiario.',
 en:'The interpreter notes a regional variation in the client\'s term. The interpreter will render the term and its meaning.'},

{c:'termino', t:'Te equivocaste y lo notaste',
 n:'La autocorrección inmediata es obligatoria y no es una falta. Ocultarla sí lo es.',
 en:'Correction by the interpreter: the previous rendition should have been "____".'},

{c:'termino', t:'El beneficiario no habla español como lengua materna',
 n:'Quechua, aymara, mam, k\'iche\', mixteco, náhuatl. Reporta pronto, no fuerces la llamada.',
 en:'The interpreter would like to inform the representative that the client does not appear to be a native Spanish speaker and may require an interpreter of another language. Comprehension is limited.'},

/* ── FLUJO ─────────────────────────────────────── */
{c:'flujo', t:'El beneficiario te habla a ti directamente',
 n:'Redirige en español primero; si insiste, reporta al REP.',
 en:'The interpreter would like to inform the representative that the client is addressing the interpreter directly. The interpreter has reminded the client to speak to the representative.',
 es:'Le recuerdo que soy el intérprete. Por favor dirija su pregunta a la representante y yo la interpreto.'},

{c:'flujo', t:'El beneficiario te pide consejo sobre qué contestar',
 n:'Situación muy común en solicitudes. Nunca orientes, ni con buena intención.',
 en:'The interpreter would like to inform the representative that the client is asking the interpreter for advice. The interpreter has explained that the interpreter cannot advise and has referred the question to the representative.',
 es:'No puedo aconsejarle ni responder por usted. Le voy a trasladar su pregunta a la representante.'},

{c:'flujo', t:'Hay un tercero hablando del lado del beneficiario',
 n:'El REP decide si esa persona puede participar o si es representante autorizado.',
 en:'The interpreter would like to inform the representative that there is a third party speaking on the client\'s side.'},

{c:'flujo', t:'Hay conversación paralela en la línea del beneficiario',
 n:'Reporta que existe, no reportes su contenido salvo que se dirija a la llamada.',
 en:'The interpreter would like to inform the representative that there is a side conversation on the client\'s line.'},

{c:'flujo', t:'El REP te pregunta algo a ti («¿entendió?», «¿qué cree usted?»)',
 n:'No respondas por el beneficiario ni des tu lectura de su estado.',
 en:'The interpreter is not able to answer on the client\'s behalf. The interpreter will render the question to the client.'},

{c:'flujo', t:'El beneficiario pide un trabajador que hable español',
 n:'Traslada el pedido tal cual; no evalúes si procede.',
 en:'The client is requesting to speak with a Spanish-speaking representative.'},

{c:'flujo', t:'El beneficiario pide recibir sus avisos en español',
 n:'Es una casilla real de la solicitud (avisos en español e inglés o solo inglés).',
 en:'The client is requesting to receive written notices in Spanish.'},

{c:'flujo', t:'El beneficiario está angustiado o llorando',
 n:'Describe el hecho observable, sin diagnosticar ni consolar por tu cuenta.',
 en:'The interpreter would like to inform the representative that the client appears distressed.'},

{c:'flujo', t:'Hay un menor de edad interpretando o respondiendo',
 n:'Reporta y deja que el REP decida el procedimiento.',
 en:'The interpreter would like to inform the representative that a minor appears to be responding on the client\'s behalf.'},

/* ── CONTENIDO SNAP ────────────────────────────── */
{c:'snap', t:'Verificación de identidad al inicio',
 n:'Tríada estándar antes de cualquier dato del caso: nombre, fecha de nacimiento, dirección.',

/* ─────────────────────────────────────────────────
   Estado y render
   ───────────────────────────────────────────────── */
let view='disclosures', cat='all', query='', script=[];
const $=s=>document.querySelector(s);
const rail=$('#rail'), stage=$('#stage'), tray=$('#tray');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function renderRail(){
  if(view!=='disclosures'){rail.innerHTML='';return}
  const counts={all:D.length};
  CATS.forEach(c=>counts[c.id]=D.filter(d=>d.c===c.id).length);
  rail.innerHTML='<p class="rail-h">Situaciones</p>'+
    `<button class="cat" data-cat="all" aria-pressed="${cat==='all'}"><b>Todas</b><i>${counts.all} aclaratorias</i></button>`+
    CATS.map(c=>`<button class="cat" data-cat="${c.id}" aria-pressed="${cat===c.id}"><b>${c.name}</b><i>${c.sub} · ${counts[c.id]}</i></button>`).join('');
  rail.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;renderRail();renderStage()});
}

function matches(d){
  if(cat!=='all'&&d.c!==cat)return false;
  if(!query)return true;
  const q=query.toLowerCase();
  return (d.t+' '+(d.n||'')+' '+d.en+' '+(d.es||'')).toLowerCase().includes(q);
}

function cardHTML(d,i){
  const c=CATS.find(x=>x.id===d.c);
  const on=script.some(s=>s.key===d.en);
  return `<article class="card">
    <div class="card-head">
      <p class="eyebrow"><span>${c?c.name:''}</span>${d.sens?'<span class="sens">· Sensible</span>':''}</p>
      <h3>${esc(d.t)}</h3>
      ${d.n?`<p class="note">${esc(d.n)}</p>`:''}
    </div>
    <div class="lane en"><span class="lane-rail"></span><div class="lane-body">
      <span class="chip">EN → al REP</span>
      <p class="say">${esc(d.en)}</p>
    </div></div>
    ${d.es?`<div class="lane es"><span class="lane-rail"></span><div class="lane-body">
      <span class="chip">ES → al beneficiario</span>
      <p class="say">${esc(d.es)}</p>
    </div></div>`:''}
    <div class="card-foot">
      <button class="abtn add ${on?'added':''}" data-i="${i}">${on? 'En el guion ✓':'+ Agregar al guion'}</button>
      <button class="abtn copy" data-i="${i}">Copiar EN</button>
    </div>
  </article>`;
}

function renderDisclosures(){
  const list=D.map((d,i)=>({d,i})).filter(o=>matches(o.d));
  stage.innerHTML=`<p class="meta">${list.length} de ${D.length} aclaratorias${query?` para «${esc(query)}»`:''}. Toda aclaratoria al REP va en tercera persona: <b>the interpreter…</b></p>`+
    (list.length? list.map(o=>cardHTML(o.d,o.i)).join('')
     : `<div class="empty">Sin resultados para «${esc(query)}». Prueba con una palabra suelta: <b>ruido</b>, <b>deletreo</b>, <b>perjurio</b>, <b>eWIC</b>.</div>`);
  bindCards();
}

function renderStatement(){
  stage.innerHTML=`<p class="meta">Bloque completo · ${STATEMENT.lines.length} segmentos</p>
  <article class="card">
    <div class="card-head">
      <p class="eyebrow"><span>Contenido SNAP</span><span class="sens">· Sensible</span></p>
      <h3>${STATEMENT.title}</h3>
      <p class="note">${STATEMENT.note}</p>
    </div>
    ${STATEMENT.lines.map((l,i)=>`
      <div class="lane en"><span class="lane-rail"></span><div class="lane-body">
        <span class="chip">${i+1} · EN → al beneficiario, vía intérprete</span>
        <p class="say">${esc(l.en)}</p>
      </div></div>
      <div class="lane es"><span class="lane-rail"></span><div class="lane-body">
        <span class="chip">ES → rendición</span>
        <p class="say">${esc(l.es)}</p>
      </div></div>`).join('')}
    <div class="card-foot">
      <button class="abtn" id="addStatement">+ Agregar bloque completo al guion</button>
    </div>
  </article>
  <p class="meta" style="margin-top:26px">Si el bloque se interrumpe</p>
  ${STATEMENT.after.map(a=>`<article class="card">
    <div class="card-head"><h3>${esc(a.t)}</h3></div>
    <div class="lane en"><span class="lane-rail"></span><div class="lane-body">
      <span class="chip">EN → al REP</span><p class="say">${esc(a.en)}</p>
    </div></div>
  </article>`).join('')}`;
  $('#addStatement').onclick=()=>{
    STATEMENT.lines.forEach((l,i)=>push({key:'stmt'+i,t:`Declaración grabada · ${i+1}`,en:l.en,es:l.es}));
    flash('Bloque de declaración agregado al guion');
  };
}

function renderGloss(){
  const q=query.toLowerCase();
  const rows=GLOSS.filter(r=>!q||r.join(' ').toLowerCase().includes(q));
  stage.innerHTML=`<p class="meta">${rows.length} términos. Marcados en rojo los falsos amigos que más se cuelan en esta cola.</p>
  <table class="gloss"><thead><tr><th>Inglés</th><th>Rendición</th><th>Nota de uso</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${r[2].startsWith('TRAMPA')?'<span class="trap">TRAMPA:</span>'+esc(r[2].slice(7)):esc(r[2])}</td></tr>`).join('')}
  </tbody></table>`;
}

function bindCards(){
  stage.querySelectorAll('.add').forEach(b=>b.onclick=()=>{
    const d=D[+b.dataset.i];
    if(script.some(s=>s.key===d.en)){script=script.filter(s=>s.key!==d.en);flash('Quitado del guion')}
    else{push({key:d.en,t:d.t,en:d.en,es:d.es});flash('Agregado al guion')}
    renderStage();
  });
  stage.querySelectorAll('.copy').forEach(b=>b.onclick=()=>copy(D[+b.dataset.i].en));
}

function push(o){script.push(o);syncTray()}
function renderStage(){
  if(view==='disclosures')renderDisclosures();
  else if(view==='statement')renderStatement();
  else renderGloss();
  syncTray();
}

function syncTray(){
  $('#trayN').textContent=script.length;
  const tb=$('#trayBtn'); tb.textContent='Guion · '+script.length; tb.dataset.n=script.length;
  $('#trayScroll').innerHTML = script.length
    ? script.map((s,i)=>`<div class="tline">
        <span class="n">${String(i+1).padStart(2,'0')}</span>
        <div class="txt">
          <h4>${esc(s.t)}</h4>
          <p class="p-en">${esc(s.en)}</p>
          ${s.es?`<p class="p-es">${esc(s.es)}</p>`:''}
        </div>
        <button class="rm" data-i="${i}">Quitar</button>
      </div>`).join('')
    : `<div class="tline"><div class="txt"><p style="color:#9DB2C9">El guion está vacío. Agrega aclaratorias desde las tarjetas y quedarán aquí en el orden en que las vas a decir.</p></div></div>`;
  $('#trayScroll').querySelectorAll('.rm').forEach(b=>b.onclick=()=>{script.splice(+b.dataset.i,1);renderStage()});
}

function plain(){
  return script.map((s,i)=>`${i+1}. ${s.t}\n   EN → REP: ${s.en}${s.es?`\n   ES → LEP: ${s.es}`:''}`).join('\n\n');
}
function copy(txt){
  navigator.clipboard?.writeText(txt).then(()=>flash('Copiado')).catch(()=>fallback(txt));
}
function fallback(txt){
  const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
  ta.select();try{document.execCommand('copy');flash('Copiado')}catch(e){flash('No se pudo copiar')}
  ta.remove();
}
let tid;
function flash(m){
  const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(tid);tid=setTimeout(()=>t.classList.remove('show'),1600);
}

/* eventos */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
  view=t.dataset.view;renderRail();renderStage();window.scrollTo({top:0,behavior:'smooth'});
});
$('#q').addEventListener('input',e=>{query=e.target.value.trim();renderStage()});
$('#liveBtn').onclick=()=>{
  const on=document.body.classList.toggle('live');
  $('#liveBtn').classList.toggle('on',on);
  $('#liveBtn').setAttribute('aria-pressed',on);
};
$('#grabBtn').onclick=()=>{
  const o=tray.classList.toggle('open');
  $('#grabBtn').setAttribute('aria-expanded',o);
  $('#grabBtn').querySelector('svg').style.transform=o?'rotate(180deg)':'';
};
$('#trayBtn').onclick=()=>$('#grabBtn').click();
$('#copyAll').onclick=()=>script.length?copy(plain()):flash('El guion está vacío');
$('#printAll').onclick=()=>script.length?window.print():flash('El guion está vacío');
$('#clearAll').onclick=()=>{script=[];renderStage();flash('Guion vaciado')};
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}
  if(e.key==='Escape'){$('#q').value='';query='';renderStage();$('#q').blur()}
});

renderRail();renderStage();
</script>
</body>
</html>
