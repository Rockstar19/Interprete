name: Actualizar tasa desde Google Sheet

on:
  workflow_dispatch:

  schedule:
    - cron: "20 8 * * *"
      timezone: "America/La_Paz"

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Leer tasa validada desde Google Sheet
        env:
          SHEET_RATE_URL: ${{ secrets.SHEET_RATE_URL }}

        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          url = os.environ["SHEET_RATE_URL"]

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "GitHub-Actions-Sheet-Reader"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              raw = response.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("HTTP:", response.status)
              print("URL final:", response.geturl())
              print(
                  "Content-Type:",
                  response.headers.get("Content-Type")
              )

          if not raw.strip():
              raise RuntimeError(
                  "Apps Script devolvió una respuesta vacía."
              )

          try:
              payload = json.loads(raw)
          except json.JSONDecodeError:
              print("Respuesta recibida:", repr(raw[:500]))
              raise RuntimeError(
                  "Apps Script no devolvió JSON."
              )

          print("Fuente:", payload.get("source"))
          print("Fecha:", payload.get("date"))
          print("Tasa:", payload.get("rate"))
          print(
              "Actualizado hoy:",
              payload.get("updatedToday")
          )
          print(
              "Fórmula:",
              payload.get("spreadFormula")
          )

          if payload.get("ok") is not True:
              raise RuntimeError(
                  "El Sheet no pasó la validación. "
                  "No se modificará el JSON."
              )

          if payload.get("source") != "BOB Mercado!B15":
              raise RuntimeError(
                  "Fuente inválida. "
                  "Solo se acepta BOB Mercado!B15."
              )

          if payload.get("spreadFormula") != "=B14-B15":
              raise RuntimeError(
                  "B16 no conserva =B14-B15."
              )

          rate = float(payload["rate"])

          if not 5.0 <= rate <= 30.0:
              raise RuntimeError(
                  f"Tasa fuera de rango: {rate}"
              )

          file = Path("progreso-ciclos.json")

          original = file.read_text(
              encoding="utf-8"
          )

          # Validamos el JSON original antes de modificarlo.
          original_json = json.loads(original)

          if "tasa" not in original_json:
              raise RuntimeError(
                  "No existe la propiedad tasa."
              )

          old_rate = original_json["tasa"]

          updated, count = re.subn(
              r'("tasa"\s*:\s*)'
              r'[0-9]+(?:\.[0-9]+)?',
              lambda m:
                  f'{m.group(1)}{rate:.2f}',
              original,
              count=1
          )

          if count != 1:
              raise RuntimeError(
                  "No se encontró exactamente "
                  "una propiedad tasa."
              )

          # Confirmamos que el resultado sigue siendo JSON válido.
          json.loads(updated)

          file.write_text(
              updated,
              encoding="utf-8"
          )

          print(
              f"Tasa anterior: {old_rate}"
          )
          print(
              f"Tasa nueva: {rate:.2f}"
          )
          PY

      - name: Verificar cambios
        id: changes
        run: |
          if git diff --quiet -- progreso-ciclos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "La tasa ya estaba actualizada."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- progreso-ciclos.json
          fi

      - name: Commit y push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add progreso-ciclos.json

          git commit \
            -m "Actualiza tasa BOB/USDT desde Google Sheet"

          git push
