- name: Leer tasa validada desde Google Sheet
  env:
    SHEET_RATE_URL: ${{ secrets.SHEET_RATE_URL }}

  run: |
    python3 <<'PY'
    import json
    import os
    import urllib.request

    url = os.environ["SHEET_RATE_URL"]

    req = urllib.request.Request(
        url,
        headers={
            "User-Agent": "GitHub-Actions-Sheet-Reader"
        }
    )

    with urllib.request.urlopen(req, timeout=30) as response:
        raw = response.read().decode("utf-8", errors="replace")

        print("HTTP:", response.status)
        print("URL final:", response.geturl())
        print("Content-Type:", response.headers.get("Content-Type"))
        print("Respuesta inicial:", repr(raw[:500]))

    if not raw.strip():
        raise RuntimeError(
            "Apps Script devolvió una respuesta vacía."
        )

    try:
        payload = json.loads(raw)
    except json.JSONDecodeError:
        raise RuntimeError(
            "Apps Script no devolvió JSON. "
            "Revisa acceso anónimo y que la URL termine en /exec."
        )

    print("JSON recibido:", payload)
    PY
