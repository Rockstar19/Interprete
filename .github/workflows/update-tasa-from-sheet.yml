name: Actualizar tasa desde Google Sheet

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *" # 08:00 America/La_Paz (UTC-4)

permissions:
  contents: write

concurrency:
  group: update-tasa-from-sheet-main
  cancel-in-progress: false

jobs:
  update-rate:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Leer tasa validada desde Google Sheet
        env:
          SHEET_RATE_URL: ${{ secrets.SHEET_RATE_URL }}

        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          def notice(titulo, mensaje):
              print(f"::notice title={titulo}::{mensaje}")

          url = os.environ.get("SHEET_RATE_URL", "").strip()
          if not url:
              raise RuntimeError(
                  "Falta el secreto SHEET_RATE_URL."
              )

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "GitHub-Actions-Sheet-Reader"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )
                  print("HTTP:", response.status)
                  print("URL final:", response.geturl())
                  print(
                      "Content-Type:",
                      response.headers.get("Content-Type")
                  )
          except urllib.error.HTTPError as err:
              cuerpo = err.read().decode("utf-8", errors="replace")
              print("Respuesta de error:", repr(cuerpo[:500]))
              raise RuntimeError(
                  f"Apps Script respondió HTTP {err.code}."
              ) from err
          except urllib.error.URLError as err:
              raise RuntimeError(
                  f"No se pudo contactar Apps Script: {err.reason}."
              ) from err

          if not raw.strip():
              raise RuntimeError(
                  "Apps Script devolvió una respuesta vacía."
              )

          try:
              payload = json.loads(raw)
          except json.JSONDecodeError:
              print("Respuesta recibida:", repr(raw[:500]))
              raise RuntimeError(
                  "Apps Script no devolvió JSON."
              )

          print("Fuente:", payload.get("source"))
          print("Fecha:", payload.get("date"))
          print("Tasa:", payload.get("rate"))
          print(
              "Actualizado hoy:",
              payload.get("updatedToday")
          )
          print(
              "Fórmula:",
              payload.get("spreadFormula")
          )
          print("ok:", payload.get("ok"))

          if payload.get("source") != "BOB Mercado!B15":
              raise RuntimeError(
                  "Fuente inválida. "
                  "Solo se acepta BOB Mercado!B15."
              )

          if payload.get("spreadFormula") != "=B14-B15":
              raise RuntimeError(
                  "B16 no conserva =B14-B15."
              )

          try:
              rate = round(float(payload["rate"]), 2)
          except (KeyError, TypeError, ValueError) as err:
              raise RuntimeError(
                  "La respuesta no trae una tasa numérica."
              ) from err

          if not 5.0 <= rate <= 30.0:
              raise RuntimeError(
                  f"Tasa fuera de rango: {rate}"
              )

          file = Path("progreso-ciclos.json")
          original = file.read_text(encoding="utf-8")
          original_json = json.loads(original)

          if "tasa" not in original_json:
              raise RuntimeError(
                  "No existe la propiedad tasa."
              )

          old_rate = round(float(original_json["tasa"]), 2)

          # Misma cifra a dos decimales: no es un error, no hay commit.
          if rate == old_rate:
              notice(
                  "Tasa BOB/USDT",
                  f"Sin cambios ({old_rate:.2f}). "
                  "Se conserva progreso-ciclos.json."
              )
              print(f"Tasa anterior: {old_rate:.2f}")
              print(f"Tasa leída: {rate:.2f}")
              sys.exit(0)

          # El Sheet no se tocó hoy, o ok=false por frescura, no por
          # fuente/fórmula. Conservar la tasa ya publicada y salir en verde.
          if payload.get("ok") is not True:
              if payload.get("updatedToday") is not True:
                  notice(
                      "Tasa BOB/USDT",
                      "El Sheet no registra cambio hoy. "
                      f"Se conserva {old_rate:.2f}."
                  )
                  print(f"Tasa conservada: {old_rate:.2f}")
                  print(f"Tasa leída (no aplicada): {rate:.2f}")
                  sys.exit(0)
              raise RuntimeError(
                  "El Sheet no pasó la validación. "
                  "No se modificará el JSON."
              )

          updated, count = re.subn(
              r'("tasa"\s*:\s*)'
              r'[0-9]+(?:\.[0-9]+)?',
              lambda m: f"{m.group(1)}{rate:.2f}",
              original,
              count=1
          )

          if count != 1:
              raise RuntimeError(
                  "No se encontró exactamente "
                  "una propiedad tasa."
              )

          json.loads(updated)
          file.write_text(updated, encoding="utf-8")

          print(f"Tasa anterior: {old_rate:.2f}")
          print(f"Tasa nueva: {rate:.2f}")
          PY

      - name: Verificar cambios
        id: changes
        run: |
          if git diff --quiet -- progreso-ciclos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "La tasa ya estaba actualizada."
            echo "::notice title=Tasa BOB/USDT::Sin cambios en el JSON. Job correcto, sin commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- progreso-ciclos.json
          fi

      - name: Commit y push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add progreso-ciclos.json

          git commit -m "Actualiza tasa BOB/USDT desde Google Sheet"
          git pull --rebase origin main
          git push origin HEAD:main
